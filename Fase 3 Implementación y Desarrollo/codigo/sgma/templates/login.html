{% extends "base.html" %}
{% block title %}Ingresar · SGMA{% endblock %}
{% block body %}
<section class="panel">
  <h1>Iniciar sesión</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required maxlength="50">
    <label for="password">Contraseña</label><input id="password" type="password" name="password" autocomplete="current-password" required>
    <p><button type="submit">Ingresar</button></p>
  </form>
  <p>¿Es la primera instalación? <a href="{{ url_for('setup') }}">Crear el administrador inicial</a></p>
</section>
{% endblock %}
